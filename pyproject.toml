[project]
name = "hanzigen"
version = "1.2.0"
description = "HanziGen"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # torch
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchaudio==2.7.1",
    # evaluation
    "scikit-image==0.25.2",
    "lpips==0.1.4",
    "clean-fid==0.1.25",
    # logging
    "rich==14.0.0",
    "tqdm==4.67.1",
    "tensorboard==2.20.0",
    # others
    "einops==0.8.1",
    "scipy==1.16.2",
    "matplotlib==3.10.1",
    "fonttools==4.57.0",
    "potracer==0.0.4"
]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
